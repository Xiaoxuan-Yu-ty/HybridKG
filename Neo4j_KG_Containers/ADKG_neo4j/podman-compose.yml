services:
  neo4j:
    image: docker.io/library/neo4j:latest
    container_name: adkg

    user: "6162:12021"
    userns_mode: "keep-id"

    ports:
      # Maps host port 7474 to container port 7474 (HTTP Browser)
      - "7474:7474"
      # Maps host port 7687 to container port 7687 (Bolt Database Connection)
      - "7687:7687"

    environment:
      NEO4J_AUTH: neo4j/test1234
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "true"
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"

    volumes:
      - ./data:/data:Z
      - ./import:/var/lib/neo4j/import:Z